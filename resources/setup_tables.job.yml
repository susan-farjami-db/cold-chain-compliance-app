resources:
  jobs:
    setup_tables:
      name: cold-chain-setup-tables
      description: Creates the cold-chain schema and tables and seeds them with sample data (idempotent).
      tasks:
        - task_key: create_tables
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../setup/create_tables.sql
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
